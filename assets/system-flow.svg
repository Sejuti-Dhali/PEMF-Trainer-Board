<title id="title">PEMF functional blocks</title><desc id="desc">Five-volt source to NE555 oscillator, transistor buffer, BD135 coil driver, copper coil, and oscilloscope observation.</desc>
<rect x="0" y="0" width="1100" height="275" rx="18" fill="#fffaf3"/>
<g font-family="Arial, sans-serif" text-anchor="middle"><rect x="25" y="62" width="178" height="126" rx="18" fill="#eee2d2"/><text x="114" y="105" font-size="12" letter-spacing="2" fill="#9a785f">POWER</text><text x="114" y="135" font-size="24" fill="#32414a">5 V supply</text><text x="114" y="161" font-size="13" fill="#686e6c">Power bank</text>
<rect x="242" y="62" width="178" height="126" rx="18" fill="#283c47"/><text x="331" y="105" font-size="12" letter-spacing="2" fill="#d3b79f">TIMING</text><text x="331" y="135" font-size="24" fill="#f7f2e8">NE555</text><text x="331" y="161" font-size="13" fill="#c0cbd0">Astable pulses</text>
