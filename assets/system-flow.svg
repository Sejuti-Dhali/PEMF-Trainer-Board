<rect x="893" y="62" width="178" height="126" rx="18" fill="#c6d9d9"/><text x="982" y="105" font-size="12" letter-spacing="2" fill="#4a6570">OUTPUT</text><text x="982" y="135" font-size="24" fill="#32414a">Copper coil</text><text x="982" y="161" font-size="13" fill="#4e686c">60 turns / 10 cm</text>
